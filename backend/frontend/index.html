<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- 手机浏览器/WebView 里按设备宽度渲染（App 内 WebView 本就按屏宽，此行主要修手机浏览器） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Open-LLM-Vtuber</title>

    <!-- ============================================================
         AI 游戏搭子 · 前端增强补丁（改这里即可，无需重新打包 APK）
         1) WebSocket 断线自动重连
         2) 屏幕共享 v2：用户消息自动附带当前画面 + 低频主动推送
         ============================================================ -->
    <script>
      /* ---------- 1) WebSocket 断线自动重连 ----------
         原版 bundle 的 onclose/onerror 只把状态置成 CLOSED，不做重连，
         断线后永远停在"点击重新连接"，表现为"说话没反应"。 */
      (function () {
        if (window.__gcAutoReconnect) return;
        window.__gcAutoReconnect = true;

        var failTicks = 0;
        var TICK_MS = 2000;
        var FAIL_TICKS = 2;      // 连续约 4 秒非 OPEN 才重连

        function wsUrl() {
          var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
          return proto + location.host + '/client-ws' + (location.search || '');
        }

        function ensureUrl(svc) {
          if (!svc.__gcLastUrl) svc.__gcLastUrl = wsUrl();
          if (!svc.__gcPatched) {
            svc.__gcPatched = true;
            var orig = svc.connect;
            svc.connect = function (u) {
              try { if (u) this.__gcLastUrl = u; } catch (e) {}
              return orig.apply(this, arguments);
            };
          }
        }

        setInterval(function () {
          try {
            var svc = window.__gcWsService;
            if (!svc || !svc.ws) return;
            ensureUrl(svc);
            if (svc.ws.readyState === 1) { failTicks = 0; return; }
            failTicks++;
            if (failTicks >= FAIL_TICKS) {
              failTicks = 0;
              console.log('[GC-AUTO] WebSocket 非 OPEN，正在重连：' + svc.__gcLastUrl);
              svc.connect(svc.__gcLastUrl);
            }
          } catch (e) {}
        }, TICK_MS);
      })();

      /* ---------- 2) 屏幕共享 v2 ---------- */
      (function () {
        if (window.__gcScreenV2) return;
        window.__gcScreenV2 = true;

        // 抢占原生屏幕注入（MainActivity 的 SCREEN_SHARE_INJECT_JS 见到此标记会直接退出），
        // 避免两套逻辑同时推送。
        window.__gcScreenInjected = 1;

        // ===== 可调参数 =====
        // 主动推送间隔（毫秒）。**默认 0 = 关闭**。
        // 原因：Agent 自己已有"主动开口"机制（conf.yaml 里
        //   proactive_speak_enabled / proactive_idle_seconds=300 / proactive_cooldown_seconds=900），
        //   再定时推屏会绕过这套冷却，表现为【没跟它说话它却一直自言自语】。
        // 想让露露偶尔就画面主动搭话，把它设成 300000（5 分钟）以上。
        var PROACTIVE_MS = 0;
        var ATTACH_TO_USER = true;  // 用户每次发消息时自动附带当前画面
        var JPEG_MIN_LEN = 100;     // 认为"有有效帧"的最小 base64 长度
        // ====================

        var lastSent = '';

        function latestFrame() {
          try {
            if (window.AndroidBridge && window.AndroidBridge.getLatestFrame) {
              var f = window.AndroidBridge.getLatestFrame();
              if (f && f.length > JPEG_MIN_LEN) return f;
            }
          } catch (e) {}
          return null;
        }

        function imgObj(b64) {
          // 后端 create_batch_input 要求对象数组
          return { source: 'screen', data: 'data:image/jpeg;base64,' + b64, mime_type: 'image/jpeg' };
        }

        function rawWs() {
          try {
            var s = window.__gcWsService;
            if (!s) return null;
            if (s.ws && s.ws.readyState === 1) return s.ws;
            if (s.readyState === 1 && typeof s.send === 'function') return s;
            return s.ws || null;
          } catch (e) { return null; }
        }

        // ---- A) 每条用户消息自动带上"此刻的屏幕" ----
        // 这样你问"我屏幕上是什么"时，AI 上下文里永远有最新画面，
        // 而且不会额外产生对话、不会刷屏。
        if (ATTACH_TO_USER) {
          try {
            var origSend = WebSocket.prototype.send;
            WebSocket.prototype.send = function (data) {
              try {
                if (typeof data === 'string' && data.indexOf('text-input') >= 0) {
                  var o = JSON.parse(data);
                  if (o && o.type === 'text-input' && (!o.images || !o.images.length)) {
                    var f = latestFrame();
                    if (f) {
                      o.images = [imgObj(f)];
                      data = JSON.stringify(o);
                      try { window.AndroidBridge.log('SCREEN', 'attached frame to user msg len=' + f.length); } catch (e) {}
                    }
                  }
                }
              } catch (e) {}
              return origSend.call(this, data);
            };
          } catch (e) {}
        }

        // ---- B) 低频主动推送（让露露能自己开口）----
        if (PROACTIVE_MS > 0) {
          setInterval(function () {
            try {
              var f = latestFrame();
              if (!f || f === lastSent) return;   // 画面没变就不打扰
              var w = rawWs();
              if (!w || w.readyState !== 1) return;
              lastSent = f;
              w.send(JSON.stringify({
                type: 'text-input',
                text: '（系统定时推送：这是我当前的手机屏幕截图。'
                    + '如果画面里没有值得你主动开口的新内容，请只回复一个英文句号"."即可，不要出声；'
                    + '如果有值得聊的，就自然地说一句。）',
                images: [imgObj(f)]
              }));
              try { window.AndroidBridge.log('SCREEN', 'proactive push len=' + f.length); } catch (e) {}
            } catch (e) {}
          }, PROACTIVE_MS);
        }
      })();

      /* ---------- 2.5) VAD 灵敏度预设（一次性写入，只写一次）----------
         症状：玩游戏时环境音/游戏音被 VAD 当成"人声" → 每 1~4 秒就 "Real speech confirmed"
         → 触发 barge-in 打断 → 露露刚开头就被打断，甚至整轮对话被 cancel
         → 用户感觉「说完话他没有任何回答，过一两分钟才回」。
         这里把阈值调高：需要更像人声、更长的语音才算说话。
         只写一次（用 gcVadTuned 标记），之后你在设置面板里改的参数不会被覆盖。 */
      (function () {
        try {
          if (localStorage.getItem('gcVadTuned')) return;      // 已写过 → 尊重用户后续的修改
          localStorage.setItem('vadSettings', JSON.stringify({
            positiveSpeechThreshold: 62,   // 默认 50：抬起说话判定门槛
            negativeSpeechThreshold: 45,   // 默认 35
            redemptionFrames: 30           // 默认 35
          }));
          localStorage.setItem('gcVadTuned', '1');
        } catch (e) {}
      })();

      /* ---------- 3) 悬浮窗(pet)模式：只显示画面，不收音 ----------
         悬浮窗 WebView 加载的是同一个页面，会独立连 WS 并启动【第二路 VAD 麦克风】。
         后果：主界面点了关麦，悬浮窗那一路还在收音，用户感觉「话筒点了没用」；
         而且两路都会把语音送去识别。
         解决：pet 模式下把 getUserMedia 换成「静音 MediaStream」——
         VAD 照常初始化，但永远检测不到语音，从而彻底消除双路收音。 */
      (function () {
        if (!/[?&]pet=1(?:&|$)/.test(location.search)) return;
        if (window.__gcPet) return;
        window.__gcPet = true;
        console.log('[GC-PET] 悬浮窗模式：麦克风已禁用（改用静音流）');
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            var _silence = null;
            function silenceStream() {
              if (_silence) return _silence;
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              var ac = new AC();
              var dest = ac.createMediaStreamDestination(); // 不接任何音源 = 纯静音
              _silence = dest.stream;
              return _silence;
            }
            navigator.mediaDevices.getUserMedia = function () {
              var s = silenceStream();
              if (s) return Promise.resolve(s);
              return Promise.reject(new Error('pet mode: microphone disabled'));
            };
          }
        } catch (e) {}
      })();

      /* ---------- 4) 把对话同步进 App 本地聊天记录 ----------
         App 右下角 🕐 打开的是原生对话框，读的是 ChatHistory 本地 JSON；
         但前端 bundle 从不调用 AndroidBridge.saveMessage，所以永远显示「暂无聊天记录」。
         这里 hook WebSocket 的收/发，把双方对话写进本地历史。 */
      (function () {
        if (window.__gcPet) return;   // 悬浮窗只显示，避免重复记录
        if (!window.AndroidBridge || !window.AndroidBridge.saveMessage) return;
        if (window.__gcHistorySync) return;
        window.__gcHistorySync = true;

        var lastRole = '', lastText = '', lastAt = 0;
        // 去掉 Live2D 表情标签（如 [smirk]）与多余空白
        function clean(text) {
          return String(text).replace(/\[[a-zA-Z_]+\]/g, ' ')
                     .replace(/\s+/g, ' ').trim();
        }
        function save(role, text) {
          try {
            text = clean(text);
            if (!text) return;
            var now = Date.now();
            // 去重：3 秒内同样的内容不重复写（防同一条消息走两条路径）
            if (role === lastRole && text === lastText && now - lastAt < 3000) return;
            lastRole = role; lastText = text; lastAt = now;
            window.AndroidBridge.saveMessage(role, text);
          } catch (e) {}
        }

        // AI 的一次回复会被按标点切成多句，每句一条 audio 消息。
        // 这里缓冲 2 秒合并成一条再存，免得聊天记录里全是碎句。
        var pendAi = '', pendTimer = null;
        function flushAi() {
          if (!pendAi) return;
          var t = pendAi;
          pendAi = '';
          if (pendTimer) { clearTimeout(pendTimer); pendTimer = null; }
          save('ai', t);
        }
        function queueAi(text) {
          var t = clean(text);
          if (!t) return;
          pendAi = pendAi ? (pendAi + t) : t;
          if (pendTimer) clearTimeout(pendTimer);
          // 6 秒兜底：正常情况下由 conversation-chain-end 提前触发 flush
          pendTimer = setTimeout(flushAi, 6000);
        }

        function handle(payload) {
          try {
            var o = typeof payload === 'string' ? JSON.parse(payload) : payload;
            if (!o || !o.type) return;
            if (o.type === 'user-input-transcription' && o.text) {
              flushAi();                            // 用户插话前先把上一条 AI 回复落地
              save('user', o.text);                 // 语音识别出来的用户话
            } else if (o.type === 'audio') {
              var dt = o.display_text;              // AI 这句话的文本
              if (dt && dt.text) queueAi(dt.text);
            } else if (o.type === 'conversation-chain-end') {
              flushAi();                            // 一轮回复结束 → 立刻合并成一条落地
            }
          } catch (e) {}
        }

        // hook 接收：onmessage 赋值 与 addEventListener 两种用法都覆盖
        try {
          var od = Object.getOwnPropertyDescriptor(WebSocket.prototype, 'onmessage');
          if (od && od.set) {
            Object.defineProperty(WebSocket.prototype, 'onmessage', {
              configurable: true,
              enumerable: od.enumerable,
              get: function () { return od.get.call(this); },
              set: function (fn) {
                od.set.call(this, function (ev) {
                  try { handle(ev && ev.data); } catch (e) {}
                  return fn.apply(this, arguments);
                });
              }
            });
          }
          var oadd = WebSocket.prototype.addEventListener;
          WebSocket.prototype.addEventListener = function (type, listener, opts) {
            if (type === 'message' && typeof listener === 'function') {
              var wrapped = function (ev) {
                try { handle(ev && ev.data); } catch (e) {}
                return listener.apply(this, arguments);
              };
              return oadd.call(this, type, wrapped, opts);
            }
            return oadd.call(this, type, listener, opts);
          };
        } catch (e) {}

        // hook 发送：用户打字发的消息
        try {
          var osend = WebSocket.prototype.send;
          WebSocket.prototype.send = function (data) {
            try {
              if (typeof data === 'string' && data.indexOf('"text-input"') >= 0) {
                var o = JSON.parse(data);
                if (o && o.type === 'text-input' && o.text) { flushAi(); save('user', o.text); }
              }
            } catch (e) {}
            return osend.call(this, data);
          };
        } catch (e) {}
      })();

      /* ---------- 5) 麦克风开关：悬浮窗按钮 ↔ 主界面麦克风按钮 双向同步 ----------
         悬浮窗那个按钮只能改原生的 MicSync 请求；真正开/关麦克风得由网页来做。
         协议：原生只下发「一次性请求（带序号）」，网页执行后 ACK；
               网页持续上报 localStorage.micOn —— 它与 App 内麦克风按钮同源，
               所以悬浮窗图标和 App 按钮永远一致。
         （旧版用 getMicWant() 布尔值持续比对：上报会覆盖请求，两边互相打架） */
      (function () {
        if (window.__gcPet) return;   // 悬浮窗不参与，避免两个 WebView 互相打架
        if (window.__gcMicSync) return;
        if (!window.AndroidBridge || !window.AndroidBridge.getMicReqSeq) return;
        window.__gcMicSync = true;

        // 状态判据：**localStorage.micOn**。
        // 这正是 App 内那个麦克风按钮自己渲染所依据的状态（VADProvider 里 useLocalStorage("micOn")），
        // 用它当判据 → 悬浮窗图标与 App 按钮在定义上就不可能不一致。
        // 踩过的坑（都已弃用）：
        //  1) hook console.log 抓 "Starting VAD"/"Stopping VAD" —— Capacitor 的 Console 桥会替换 console；
        //  2) 按钮底色 —— 主题/状态一变就不可靠；
        //  3) getUserMedia 乐观上报 —— 初始化失败时会谎报"已开"。
        var lastReported = null;
        var lastAckSeq = 0;

        function report(on) {
          try { if (window.AndroidBridge.reportMic) window.AndroidBridge.reportMic(on); } catch (e) {}
        }

        function micOn() {
          try {
            var v = localStorage.getItem('micOn');
            return v === null ? null : (v === 'true');
          } catch (e) { return null; }
        }

        function micButton() {
          var b = document.querySelector('[aria-label="Toggle microphone"]');
          if (b) return b;
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            var r = btns[i].getBoundingClientRect();
            // 底部工具条最左侧那个就是麦克风（CSS 像素，设备高 2712/3≈904）
            if (r.top > 780 && r.top < 900 && r.left < 40) return btns[i];
          }
          return null;
        }

        setInterval(function () {
          try {
            // A) 上报真实状态（与 App 内按钮同源）→ 悬浮窗图标跟随
            var on = micOn();
            if (on !== null && on !== lastReported) {
              lastReported = on;
              report(on);
            }

            // B) 应用原生的一次性请求（带序号，执行后 ACK，绝不反复点）
            var seq = window.AndroidBridge.getMicReqSeq();
            if (seq > lastAckSeq) {
              lastAckSeq = seq;
              var want = window.AndroidBridge.getMicReqValue();
              if (on !== null && on !== !!want) {
                var b = micButton();
                if (b) {
                  b.click();
                  console.log('[GC-MIC] 应用原生请求 -> ' + want);
                }
              }
              try { if (window.AndroidBridge.ackMicReq) window.AndroidBridge.ackMicReq(seq); } catch (e) {}
            }
          } catch (e) {}
        }, 600);
      })();

      /* ---------- 6) 设置中心（人设 / 形象 / 声音 / 提醒）----------
         两端共用同一份数据与操作逻辑，只有外壳不同：
           · 电脑端：右上角紧凑挂件（与旧版观感一致，鼠标点选）
           · 手机端：同位置加大入口 → 全屏设置中心（分栏 Tab，大按钮易点）
         人设走 switch-config，形象走 switch-model（只换皮不换人），
         声线走 switch-voice / save-voice，提醒走 reminder-*。
         悬浮窗(pet)模式不加载。 */
      (function () {
        if (window.__gcPet) return;
        if (window.__gcPanelV2) return;
        window.__gcPanelV2 = true;

        /* ================= 环境判定 ================= */
        // 触摸设备且屏幕较短边小于 820px → 移动版布局
        var IS_MOBILE = false;
        try {
          IS_MOBILE = ('ontouchstart' in window)
            && Math.min(window.innerWidth, window.innerHeight) < 820;
        } catch (e) {}

        /* URL 参数（便于调试与原生深链）：
             ?gc_ui=mobile|desktop      强制布局（默认按触摸+屏宽自动判断）
             ?gc_open=persona|model|voice|remind   打开设置中心并定位分栏
           注意：pet 悬浮窗模式已在函数开头直接返回，不受影响。 */
        var Q = {};
        try {
          String(location.search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
            if (!kv) return;
            var eq = kv.indexOf('=');
            Q[decodeURIComponent(eq < 0 ? kv : kv.slice(0, eq))] =
              eq < 0 ? '' : decodeURIComponent(kv.slice(eq + 1));
          });
        } catch (e) {}
        if (Q.gc_ui === 'mobile') IS_MOBILE = true;
        else if (Q.gc_ui === 'desktop') IS_MOBILE = false;
        var TAP = 44;                                  // 最小可点边长（CSS px）
        var Z = 2147480000;                            // 盖住一切

        /* ================= 数据层 ================= */
        var S = {
          configs: null, currentConfig: '',
          models: null, currentModel: '',
          voices: null, currentVoice: null,
          reminders: null
        };
        var renderTimer = null;
        function scheduleRender() {
          if (renderTimer) return;
          renderTimer = setTimeout(function () { renderTimer = null; renderAll(); }, 60);
        }

        function ws() {
          try {
            var s = window.__gcWsService;
            if (s && s.ws && s.ws.readyState === 1) return s.ws;
            if (s && s.readyState === 1 && typeof s.send === 'function') return s;
          } catch (e) {}
          return null;
        }

        function send(obj) {
          var s = ws();
          if (!s) { toast('⚠️ 未连接后端'); return false; }
          try { s.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
        }

        function fetchAll() {
          send({ type: 'fetch-configs' });
          send({ type: 'fetch-models' });
          send({ type: 'fetch-voices' });
          send({ type: 'reminder-list' });
        }

        /* ================= 轻提示 ================= */
        var toastEl = null, toastTimer = null;
        function toast(msg, kind) {
          if (!toastEl) {
            toastEl = document.createElement('div');
            toastEl.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);'
              + 'z-index:' + (Z + 10) + ';padding:10px 16px;border-radius:12px;'
              + 'background:rgba(20,22,34,.94);color:#fff;font-size:14px;line-height:1.4;'
              + 'max-width:80vw;text-align:center;pointer-events:none;opacity:0;'
              + 'transition:opacity .18s;box-shadow:0 6px 24px rgba(0,0,0,.4);';
            document.documentElement.appendChild(toastEl);
          }
          toastEl.style.color = kind === 'err' ? '#ffb4b4' : (kind === 'ok' ? '#a7f3c6' : '#fff');
          toastEl.textContent = msg;
          toastEl.style.opacity = '1';
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.style.opacity = '0'; }, 1800);
        }

        /* ================= 样式（两端共用） ================= */
        var style = document.createElement('style');
        // 兼容老 WebView（Chrome 79）：不用 inset:0（87+）、不用 flex gap（84+）
        // → 全部改用四边定位 + grid gap（57+）/ 兄弟选择器边距
        style.textContent = [
          '.gc-root,.gc-root *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}',
          '.gc-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;',
          '  font-size:13px;color:#fff;line-height:1.45}',

          /* ---- 通用控件 ---- */
          '.gc-row{display:flex;align-items:center;padding:10px 12px;border-radius:10px;',
          '  background:rgba(255,255,255,.07);cursor:pointer;transition:background .12s}',
          '.gc-row > * + *{margin-left:8px}',
          '.gc-row:active{background:rgba(255,255,255,.22)}',
          '.gc-row .gc-main{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
          '.gc-row .gc-sub{display:block;font-size:11px;opacity:.55;overflow:hidden;',
          '  text-overflow:ellipsis;white-space:nowrap;margin-top:1px}',
          '.gc-row.gc-on{background:rgba(96,165,250,.20);box-shadow:inset 0 0 0 1px rgba(96,165,250,.75)}',
          '.gc-row.gc-on .gc-main{font-weight:600}',
          '.gc-check{flex:0 0 auto;font-size:11px;padding:2px 7px;border-radius:20px;',
          '  background:rgba(96,165,250,.9);color:#fff;white-space:nowrap}',
          '.gc-sec{opacity:.7;font-weight:600;padding:10px 2px 2px;font-size:12px}',
          '.gc-hint{opacity:.5;padding:4px 2px;font-size:12px}',
          '.gc-list{display:grid;grid-auto-rows:min-content;row-gap:6px}',

        document.documentElement.appendChild(style);

        /* ================= 视图外壳 ================= */
        var widget = null, sheet = null, fab = null;
        var curTab = 'persona';     // persona | model | voice | remind
        var bodyWrap = null, tabsEl = null;
        var openDesktop = false;    // 电脑端挂件是否展开

        function el(tag, css, text) {
          var d = document.createElement(tag);
          if (css) d.style.cssText = css;
          if (text != null) d.textContent = text;
          return d;
        }

        /* ---------- 电脑端挂件 ---------- */
        function buildWidget() {
          widget = el('div', '', '');
          widget.className = 'gc-widget gc-root';

          var trigger = el('div', '', '');
          trigger.className = 'gc-trigger';
          var dot = el('div', '', '');
          dot.className = 'gc-dot';
          var t1 = el('div', '', '🎭 人设 / 👗 形象 / 🎙 声音');
          t1.className = 'gc-t';
          var t2 = el('div', '', '⏰ 提醒');
          t2.className = 'gc-t';
          trigger.appendChild(dot); trigger.appendChild(t1); trigger.appendChild(t2);

          var body = el('div', '', '');
          body.className = 'gc-body';

          t1.onclick = function () {
            openDesktop = !openDesktop || curTab === 'remind';
            curTab = 'persona';
            refreshOpen();
          };
          t2.onclick = function () {
            var wasOpen = openDesktop && curTab === 'remind';
            curTab = 'remind';
            openDesktop = !wasOpen;
            refreshOpen();
          };

          widget.appendChild(trigger);
          widget.appendChild(body);
          widget.__body = body;
          widget.__dot = dot;
          document.documentElement.appendChild(widget);
        }

        function refreshOpen() {
          if (IS_MOBILE) return;
          widget.__body.style.display = openDesktop ? 'flex' : 'none';
          if (openDesktop) fetchAll();
          renderAll();
          updateDot();
        }

        function updateDot() {
          var d = widget && widget.__dot;
          if (!d) return;
          var ok = !!ws();
          d.className = 'gc-dot' + (ok ? ' ok' : '');
        }

        /* ---------- 手机端：入口 + 全屏设置中心 ---------- */
        function buildMobile() {
          fab = el('div', '', '');
          fab.className = 'gc-fab gc-root';
          fab.appendChild(el('span', 'font-size:16px', '⚙️'));
          fab.appendChild(el('span', '', '设置'));
          fab.onclick = function () { openSheet(); };
          document.documentElement.appendChild(fab);
        }

        function openSheet(tab) {
          if (tab) curTab = tab;
          if (!sheet) sheet = createSheet();
          sheet.__mask.style.display = 'block';
          sheet.style.display = 'flex';
          fetchAll();
          renderAll();
        }

        function closeSheet() {
          if (!sheet) return;
          sheet.style.display = 'none';
          sheet.__mask.style.display = 'none';
        }

        function createSheet() {
          var mask = el('div', '', '');
          mask.className = 'gc-mask';
          mask.onclick = closeSheet;

          var sh = el('div', '', '');
          sh.className = 'gc-sheet gc-root';

          // 顶栏
          var head = el('div', '', '');
          head.className = 'gc-sheet-head';
          head.appendChild(el('div', '', '⚙️ 设置中心'))
            .className = 'gc-sheet-title';
          var close = el('div', '', '✕');
          close.className = 'gc-close';
          close.onclick = closeSheet;
          head.appendChild(close);

          // Tab 栏
          tabsEl = el('div', '', '');
          tabsEl.className = 'gc-tabs';
          [['persona', '🎭', '人设'], ['model', '👗', '形象'],
           ['voice', '🎙', '声音'], ['remind', '⏰', '提醒']].forEach(function (t) {
            var tab = el('div', '', '');
            tab.className = 'gc-tab';
            tab.dataset.k = t[0];
            tab.appendChild(el('span', '', t[1])).className = 'gc-tab-i';
            tab.appendChild(el('span', '', t[2]));
            tab.onclick = function () {
              curTab = t[0];
              renderAll();
              bodyWrap.scrollTop = 0;
            };
            tabsEl.appendChild(tab);
          });

          bodyWrap = el('div', '', '');
          bodyWrap.className = 'gc-body-wrap';

          sh.appendChild(head);
          sh.appendChild(tabsEl);
          sh.appendChild(bodyWrap);
          document.documentElement.appendChild(mask);
          document.documentElement.appendChild(sh);
          sh.__mask = mask;
          sh.__bodyWrap = bodyWrap;
          return sh;
        }

        /* ================= 渲染 ================= */
        function renderAll() {
          if (IS_MOBILE) {
            if (!sheet || sheet.style.display === 'none') { updateDot(); return; }
            Array.prototype.forEach.call(tabsEl.children, function (t) {
              if (t.dataset.k === curTab) t.classList.add('gc-active');
              else t.classList.remove('gc-active');
            });
            bodyWrap.innerHTML = '';
            renderTab(bodyWrap, curTab, true);
          } else {
            if (!widget) return;
            updateDot();
            if (!openDesktop) return;
            var b = widget.__body;
            b.innerHTML = '';
            // 电脑端把三栏纵向铺开（保持旧观感），提醒单独一栏
            if (curTab === 'remind') {
              renderTab(b, 'remind', false);
            } else {
              renderTab(b, 'persona', false);
              renderTab(b, 'model', false);
              renderTab(b, 'voice', false);
            }
          }
        }

        function renderTab(box, tab, mobile) {
          if (tab === 'persona') return renderPersona(box, mobile);
          if (tab === 'model') return renderModel(box, mobile);
          if (tab === 'voice') return renderVoice(box, mobile);
          if (tab === 'remind') return renderRemind(box, mobile);
        }

        function sec(box, text) { box.appendChild(el('div', '', text)).className = 'gc-sec'; }
        function hint(box, text) { box.appendChild(el('div', '', text)).className = 'gc-hint'; }
        function listBox(box, mobile) {
          var d = el('div', '', '');
          if (mobile) d.className = 'gc-card';
          d.classList.add('gc-list');
          box.appendChild(d);
          return d;
        }

        function row(parent, opts) {
          var r = el('div', '', '');
          r.className = 'gc-row' + (opts.on ? ' gc-on' : '');
          var main = el('div', '', '');
          main.className = 'gc-main';
          main.appendChild(el('div', '', opts.title));
          if (opts.sub) main.appendChild(el('span', '', opts.sub)).className = 'gc-sub';
          r.appendChild(main);
          if (opts.on) {
            var c = el('div', '', '✓ 使用中');
            c.className = 'gc-check';
            r.appendChild(c);
          }
          if (opts.onClick) r.onclick = opts.onClick;
          parent.appendChild(r);
          return r;
        }

        /* ---------- 人设 ---------- */
        function renderPersona(box, mobile) {
          sec(box, '🎭 人设（性格 · 声线 · 设定）');
          if (!S.configs) { hint(box, ws() ? '加载中…' : '⚠️ 未连接后端'); return; }
          if (!S.configs.length) { hint(box, '（没有可用人设）'); return; }
          var l = listBox(box, mobile);
          S.configs.forEach(function (c) {
            var file = (typeof c === 'string') ? c : (c.filename || c.file || '');
            var name = (typeof c === 'string') ? c : (c.name || file);
            if (!file) return;
            // 后端按 conf_uid 比对出的 current 是唯一权威（conf.yaml 与
            // zh_星野露露.yaml 这类同 uid 配置只标第一份），这里不做本地推断
            var isOn = (typeof c === 'object') && c.current === true;
            row(l, {
              title: '🎭 ' + name,
              sub: file,
              on: isOn,
              onClick: function () {
                if (isOn) { toast('已经是这个人设了'); return; }
                if (send({ type: 'switch-config', file: file })) {
                  renderAll();
                  toast('正在切换到「' + name + '」…（首次切换约需半分钟）');
                }
              }
            });
          });
          hint(box, '切换人设会重载角色设定与对话上下文。');
        }

        /* ---------- 形象 ---------- */
        function renderModel(box, mobile) {
          sec(box, '👗 形象（Live2D 外观，只换皮不换人）');
          if (!S.models) { hint(box, ws() ? '加载中…' : '⚠️ 未连接后端'); return; }
          if (!S.models.length) { hint(box, '（没有可用形象）'); return; }
          var l = listBox(box, mobile);
          S.models.forEach(function (m) {
            if (!m.name) return;
            var isOn = (m.current === true) || (m.name === S.currentModel);
            row(l, {
              title: '👗 ' + m.name,
              sub: m.description || '',
              on: isOn,
              onClick: function () {
                if (isOn) { toast('已经是这个形象了'); return; }
                if (send({ type: 'switch-model', model: m.name })) {
                  S.currentModel = m.name;
                  renderAll();
                  toast('正在切换到「' + m.name + '」…');
                }
              }
            });
          });
        }

        /* ---------- 声音 ---------- */
        function renderVoice(box, mobile) {
          sec(box, '🎙 声音（克隆音色，点击切换）');
          if (!S.voices) { hint(box, ws() ? '加载中…' : '⚠️ 未连接后端'); return; }
          var l = listBox(box, mobile);
          if (!S.voices.length) hint(l, '（还没有声线，下面录一段试试）');
          S.voices.forEach(function (v) {
            var nm = (typeof v === 'string') ? v : (v.name || '');
            if (!nm) return;
            var isOn = (nm === S.currentVoice);
            row(l, {
              title: '🔊 ' + nm,
              sub: '',
              on: isOn,
              onClick: function () {
                if (isOn) { toast('已经在这个声线了'); return; }
                send({ type: 'switch-voice', name: nm });
                S.currentVoice = nm;
                renderAll();
                toast('声线已切到「' + nm + '」');
              }
            });
          });
          box.appendChild(voiceAddForm(mobile));
        }

        var recBtnRef = null, recState = { rec: null, chunks: [], sec: 0, timer: null };
        function voiceAddForm(mobile) {
          var form = el('div', '', '');
          form.className = 'gc-form';

          form.appendChild(el('div', 'font-weight:600;font-size:12px', '➕ 新增声线（克隆）'));

          var rec = el('div', '', '');
          rec.className = 'gc-rec';
          var live = el('span', '', '');
          live.className = 'gc-dot-live';
          live.style.display = 'none';
          var recTxt = el('span', 'flex:1 1 auto', '录一段 3~10 秒的清晰人声');
          rec.appendChild(live); rec.appendChild(recTxt);
          var recBtn = el('div', '', '开始录音');
          recBtn.className = 'gc-btn gc-green';
          rec.appendChild(recBtn);
          recBtnRef = recBtn;

          var fileIn = el('input', 'display:none', '');
          fileIn.type = 'file';
          fileIn.accept = 'audio/*';
          var impBtn = el('div', '', '📁 导入音频文件');
          impBtn.className = 'gc-btn';

          var nameIn = el('input', '', '');
          nameIn.className = 'gc-in';
          nameIn.placeholder = '声线名字（例：露露 / 御姐音）';
          var textIn = el('input', '', '');
          textIn.className = 'gc-in';
          textIn.placeholder = '参考音频里说的原话（一字不差，克隆关键）';
          var saveBtn = el('div', '', '保存到声线库');
          saveBtn.className = 'gc-btn gc-primary';
          saveBtn.disabled = true;
          saveBtn.style.opacity = '.5';

          var pending = null;   // 待保存的 wav ArrayBuffer
          function enableSave(ok) {
            saveBtn.disabled = !ok;
            saveBtn.style.opacity = ok ? '1' : '.5';
          }

          recBtn.onclick = function () {
            if (recState.rec) { recState.rec.stop(); return; }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              toast('当前环境不支持录音', 'err'); return;
            }
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
              var mr = new MediaRecorder(stream);
              recState.rec = mr; recState.chunks = []; recState.sec = 0;
              mr.ondataavailable = function (e) { if (e.data && e.data.size) recState.chunks.push(e.data); };
              mr.onstop = function () {
                stream.getTracks().forEach(function (t) { t.stop(); });
                clearInterval(recState.timer);
                recState.rec = null;
                live.style.display = 'none';
                recBtn.textContent = '重新录音';
                recTxt.textContent = '处理中…';
                blobToWav(new Blob(recState.chunks))
                  .then(function (buf) {
                    pending = buf;
                    enableSave(true);
                    recTxt.textContent = '已就绪（' + recState.sec + ' 秒）→ 填下面两项再保存';
                  })
                  .catch(function (e) {
                    recTxt.textContent = '录音处理失败：' + e.message;
                  });
              };
              mr.start();
              live.style.display = '';
              recBtn.textContent = '停止';
              recTxt.textContent = '录音中… 建议 3~10 秒';
              recState.timer = setInterval(function () {
                recState.sec += 1;
                recTxt.textContent = '录音中… ' + recState.sec + ' 秒（建议 3~10 秒）';
                if (recState.sec >= 15) mr.stop();
              }, 1000);
            }).catch(function (e) { toast('麦克风打开失败：' + e.message, 'err'); });
          };

          impBtn.onclick = function () { fileIn.click(); };
          fileIn.onchange = function () {
            if (!fileIn.files || !fileIn.files[0]) return;
            var f = fileIn.files[0];
            recTxt.textContent = '正在读取「' + f.name + '」…';
            blobToWav(f).then(function (buf) {
              pending = buf;
              enableSave(true);
              recTxt.textContent = '已导入：' + f.name + ' → 填下面两项再保存';
            }).catch(function (e) { recTxt.textContent = '导入失败：' + e.message; });
            fileIn.value = '';
          };

          saveBtn.onclick = function () {
            var nm = (nameIn.value || '').trim();
            var tx = (textIn.value || '').trim();
            if (!pending) { toast('先录一段或导入音频', 'err'); return; }
            if (!nm) { toast('给声线起个名字', 'err'); return; }
            if (!tx) { toast('请填写参考音频里说的原话', 'err'); return; }
            if (!send({ type: 'save-voice', name: nm, text: tx, audio: wavToB64(pending) })) return;
            toast('正在上传声线，请稍候…');
            pending = null;
            enableSave(false);
            nameIn.value = ''; textIn.value = '';
            recTxt.textContent = '已提交，稍后点列表里的名字即可切换';
            setTimeout(fetchAll, 2500);
          };

          form.appendChild(rec);
          form.appendChild(impBtn);
          form.appendChild(fileIn);
          form.appendChild(nameIn);
          form.appendChild(textIn);
          form.appendChild(saveBtn);
          if (!mobile) form.style.padding = '8px';
          return form;
        }

        /* --- 音频 → 24k 单声道 WAV（后端 zipvoice 要求） --- */
        function encodeWav(samples, rate) {
          var buf = new ArrayBuffer(44 + samples.length * 2);
          var v = new DataView(buf);
          function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
          str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
          str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
          v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
          v.setUint16(32, 2, true); v.setUint16(34, 16, true);
          str(36, 'data'); v.setUint32(40, samples.length * 2, true);
          for (var i = 0; i < samples.length; i++) {
            var s = Math.max(-1, Math.min(1, samples[i]));
            v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          }
          return buf;
        }

        function blobToWav(blob) {
          return blob.arrayBuffer().then(function (ab) {
            var AC = window.AudioContext || window.webkitAudioContext;
            var ac = new AC();
            return ac.decodeAudioData(ab).then(function (src) {
              var dur = src.duration;
              if (dur < 2) { ac.close(); throw new Error('音频太短（至少 2 秒，建议 3~10 秒）'); }
              if (dur > 15) dur = 15;
              var off = new OfflineAudioContext(1, Math.ceil(dur * 24000), 24000);
              var node = off.createBufferSource();
              node.buffer = src; node.connect(off.destination); node.start(0);
              return off.startRendering().then(function (out) {
                ac.close();
                return encodeWav(out.getChannelData(0), 24000);
              });
            });
          });
        }

        function wavToB64(buf) {
          var bytes = new Uint8Array(buf), bin = '';
          for (var i = 0; i < bytes.length; i += 8192)
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
          return btoa(bin);
        }

        /* ---------- 提醒 ---------- */
        var remindDraft = { mode: 'none', days: {} };
        function renderRemind(box, mobile) {
          sec(box, '⏰ 定时提醒（到点她会主动开口）');
          if (!ws()) hint(box, '⚠️ 未连接后端——连上后提醒才会响');
          if (!S.reminders) { hint(box, '加载中…'); return; }
          var l = listBox(box, mobile);
          if (!S.reminders.length) hint(l, '（暂无提醒）');
          S.reminders.forEach(function (r) {
            var rowEl = row(l, {
              title: '⏰ ' + (r.desc || r.fire_at || ''),
              sub: r.text || '',
              on: false,
              onClick: function () {
                if (!send({ type: 'reminder-cancel', id: r.id })) return;
                toast('已取消该提醒');
                S.reminders = S.reminders.filter(function (x) { return x.id !== r.id; });
                renderAll();
              }
            });
            var del = el('div', '', '删除');
            del.className = 'gc-check';
            del.style.background = 'rgba(239,68,68,.85)';
            rowEl.appendChild(del);
          });
          box.appendChild(remindForm(mobile));
        }

        function remindForm(mobile) {
          var form = el('div', '', '');
          form.className = 'gc-form';
          form.appendChild(el('div', 'font-weight:600;font-size:12px', '➕ 新建提醒'));

          var txt = el('input', '', '');
          txt.className = 'gc-in';
          txt.placeholder = '提醒内容（例：该值日了 / 查快递）';

          var line = el('div', '', '');
          line.className = 'gc-grid2';
          var tm = el('input', '', '');
          tm.className = 'gc-in';
          tm.type = 'time';
          var min = el('input', '', '');
          min.className = 'gc-in';
          min.type = 'number';
          min.min = '0.5'; min.step = '0.5';
          min.placeholder = '或 N 分钟后';
          line.appendChild(tm); line.appendChild(min);

          var modes = el('div', '', '');
          modes.className = 'gc-grid2';
          var modeNames = [['none', '单次'], ['daily', '每天'], ['weekly', '每周']];
          modeNames.forEach(function (m) {
            var c = el('div', '', m[1]);
            c.className = 'gc-chip' + (remindDraft.mode === m[0] ? ' gc-active' : '');
            c.dataset.m = m[0];
            c.onclick = function () {
              remindDraft.mode = m[0];
              Array.prototype.forEach.call(modes.children, function (x) {
                x.classList.toggle('gc-active', x.dataset.m === remindDraft.mode);
              });
              days.style.display = (remindDraft.mode === 'weekly') ? 'grid' : 'none';
            };
            modes.appendChild(c);
          });

          var days = el('div', '', '');
          days.className = 'gc-grid2';
          days.style.display = (remindDraft.mode === 'weekly') ? 'grid' : 'none';
          [1, 2, 3, 4, 5, 6, 7].forEach(function (d) {
            var c = el('div', '', '周' + '一二三四五六日'[d - 1]);
            c.className = 'gc-chip' + (remindDraft.days[d] ? ' gc-active' : '');
            c.onclick = function () {
              remindDraft.days[d] = !remindDraft.days[d];
              c.classList.toggle('gc-active', !!remindDraft.days[d]);
            };
            days.appendChild(c);
          });

          var add = el('div', '', '＋ 添加提醒');
          add.className = 'gc-btn gc-primary';
          add.onclick = function () {
            var t = (txt.value || '').trim();
            if (!t) { toast('先填提醒内容', 'err'); return; }
            var wk = Object.keys(remindDraft.days)
              .filter(function (d) { return remindDraft.days[d]; }).join(',');
            if (remindDraft.mode === 'weekly' && !wk) { toast('选一下星期几', 'err'); return; }
            var atTime = tm.value || '';
            if (remindDraft.mode === 'none' && !atTime && !(parseFloat(min.value) > 0)) {
              toast('填时间，或写几分钟后', 'err'); return;
            }
            if (!send({
              type: 'reminder-add', text: t,
              at_time: atTime,
              delay_minutes: (!atTime && remindDraft.mode === 'none') ? (parseFloat(min.value) || 0) : 0,
              repeat: remindDraft.mode,
              weekdays: wk
            })) return;
            txt.value = ''; min.value = '';
            toast('已添加提醒');
            setTimeout(fetchAll, 1200);
          };

          form.appendChild(txt);
          form.appendChild(line);
          form.appendChild(modes);
          form.appendChild(days);
          form.appendChild(add);
          hint(form, '循环提醒到点会自动排下一次；点列表条目可取消。也可以直接跟她说「每天8点提醒我…」');
          return form;
        }

        /* ================= 消息监听（数据回来 → 重绘） ================= */
        var lastSock = null;
        setInterval(function () {
          updateDot();
          var s = ws();
          if (!s || s === lastSock) return;
          lastSock = s;
          try {
            s.addEventListener('message', function (ev) {
              try {
                if (typeof ev.data !== 'string' || ev.data.length > 200000) return;
                if (ev.data.indexOf('config-files') < 0 && ev.data.indexOf('model-list') < 0
                    && ev.data.indexOf('voice-list') < 0 && ev.data.indexOf('reminder-list') < 0
                    && ev.data.indexOf('voice-saved') < 0 && ev.data.indexOf('config-switched') < 0) return;
                var o = JSON.parse(ev.data);
                if (o.type === 'config-files') {
                  S.configs = o.configs || [];
                  S.currentConfig = o.current || S.currentConfig;
                  scheduleRender();
                } else if (o.type === 'model-list') {
                  S.models = o.models || [];
                  S.currentModel = o.current || S.currentModel;
                  scheduleRender();
                } else if (o.type === 'voice-list') {
                  S.voices = o.voices || [];
                  S.currentVoice = o.current || null;
                  scheduleRender();
                } else if (o.type === 'reminder-list') {
                  S.reminders = o.reminders || [];
                  scheduleRender();
                } else if (o.type === 'voice-saved') {
                  toast(o.message || '声线已保存', 'ok');
                  setTimeout(fetchAll, 800);
                } else if (o.type === 'config-switched') {
                  toast(o.message || '已切换', 'ok');
                  setTimeout(fetchAll, 500);
                }
              } catch (e) {}
            });
          } catch (e) {}
        }, 1000);

        /* ================= 对外入口（原生 App 可调用） ================= */
        window.gcOpenSettings = function (tab) {
          if (IS_MOBILE) openSheet(tab || 'persona');
          else { curTab = tab || 'persona'; openDesktop = true; refreshOpen(); }
        };
        window.gcCloseSettings = function () {
          if (IS_MOBILE) closeSheet(); else { openDesktop = false; refreshOpen(); }
        };

        /* ================= 初始化 ================= */
        if (IS_MOBILE) buildMobile(); else buildWidget();
        if (Q.gc_open) window.gcOpenSettings(Q.gc_open);
        updateDot();
      })();

    </script>
